[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchdeck-scorer"
version = "1.0.0"
description = "Slide-by-slide investor scoring of a startup pitch deck against VC frameworks, with a fix roadmap."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Startup Pitch Deck Scorer Contributors" }]
keywords = ["pitch-deck", "vc", "startup", "fundraising", "scoring", "investor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.0,<3",
    "jinja2>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<9",
]

[project.optional-dependencies]
llm = ["openai>=1.40,<2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
crawl = ["crawl4ai>=0.3"]

[project.scripts]
pitchdeck-scorer = "pitchdeck_scorer.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/startup-pitch-deck-scorer"
Issues = "https://github.com/your-org/startup-pitch-deck-scorer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pitchdeck_scorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Preserve Optional[X]/Union[X, Y] style for Python 3.9 + pydantic runtime safety.
ignore = ["UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"pitchdeck_scorer/report.py" = ["E501"]
"tests/*" = ["E501"]
